<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD — Waitlist admin (Excel export)</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:32px;max-width:420px;width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.06)}
  .mark{display:inline-flex;width:34px;height:34px;border-radius:9px;background:#1d1d1f;color:#fff;font-weight:700;align-items:center;justify-content:center;font-size:18px}
  h1{font-size:18px;margin:14px 0 4px}
  p.sub{color:#6e6e73;font-size:13.5px;margin:0 0 20px;line-height:1.5}
  label{font-size:12px;font-weight:600;color:#6e6e73;text-transform:uppercase;letter-spacing:.04em}
  input{width:100%;box-sizing:border-box;border:1.5px solid #e5e5ea;border-radius:10px;padding:11px 12px;font-size:14px;margin:6px 0 14px;outline:none}
  input:focus{border-color:#1d1d1f}
  button{width:100%;border:0;border-radius:10px;background:#1d1d1f;color:#fff;font-weight:600;font-size:14px;padding:12px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .msg{font-size:13px;margin-top:14px;display:none;border-radius:8px;padding:10px 12px}
  .ok{display:block;background:#e8f8ee;color:#1d7a3a}
  .bad{display:block;background:#fdeaea;color:#b3261e}
  .hint{font-size:12px;color:#8e8e93;margin-top:16px;line-height:1.5}
  .hint a{color:#1d1d1f}
</style>
</head>
<body>
<div class="card">
  <span class="mark">C</span>
  <h1>Waitlist admin</h1>
  <p class="sub">Paste your <b>service_role</b> key once (kept in memory only, never saved or sent anywhere except Supabase) and download all signups as an Excel file.</p>
  <label for="skey">service_role key</label>
  <input id="skey" type="password" placeholder="sb_secret_... or eyJhbGciOi..." autocomplete="off">
  <button id="dl" type="button">Download Excel (.xlsx)</button>
  <div class="msg" id="msg"></div>
  <p class="hint">Where to find the key: <a href="https://supabase.com/dashboard/project/zqmdubzwlfjpzpftawme/settings/api-keys" target="_blank" rel="noopener">Supabase → Settings → API Keys</a>. Use the secret/service_role key — never share this page's URL with it typed in.</p>
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function(){
  var URL = 'https://zqmdubzwlfjpzpftawme.supabase.co';
  var btn = document.getElementById('dl');
  var msg = document.getElementById('msg');
  function show(cls, text){ msg.className = 'msg ' + cls; msg.textContent = text; }

  btn.addEventListener('click', function(){
    var key = document.getElementById('skey').value.trim();
    if(!key){ show('bad', 'Paste your service_role key first.'); return; }
    btn.disabled = true;
    btn.textContent = 'Fetching signups…';
    fetch(URL + '/rest/v1/waitlist?select=email,store,source,signed_up_at&order=signed_up_at.asc', {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
    }).then(function(r){
      if(!r.ok){ return r.json().then(function(e){ throw new Error(e.message || ('HTTP ' + r.status)); }); }
      return r.json();
    }).then(function(rows){
      if(!rows.length){ show('bad', 'No signups yet.'); return; }
      var data = rows.map(function(x, i){
        return {
          '#': i + 1,
          'Email': x.email,
          'Store URL': x.store,
          'Source': x.source,
          'Signed up at': new Date(x.signed_up_at).toLocaleString()
        };
      });
      var ws = XLSX.utils.json_to_sheet(data);
      ws['!cols'] = [{wch:5},{wch:32},{wch:34},{wch:16},{wch:22}];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Waitlist');
      var stamp = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, 'CAD-waitlist-' + stamp + '.xlsx');
      show('ok', rows.length + ' signups exported to Excel.');
    }).catch(function(err){
      show('bad', 'Failed: ' + err.message + ' — check the key is the service_role (secret) key.');
    }).then(function(){
      btn.disabled = false;
      btn.textContent = 'Download Excel (.xlsx)';
    });
  });
})();
</script>
</body>
</html>
